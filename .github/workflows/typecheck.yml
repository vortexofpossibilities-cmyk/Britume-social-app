
name: BRITUME TypeScript Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Download BRITUME source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout "${GITHUB_SHA}"

      - name: Install dependencies
        working-directory: source
        run: |
          node --version
          npm --version
          npm install

      - name: Run TypeScript check
        working-directory: source
        run: npm run typecheck
