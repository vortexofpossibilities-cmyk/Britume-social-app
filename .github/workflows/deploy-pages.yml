name: Build and deploy BRITUME web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build BRITUME web app
        run: npx expo export --platform web --output-dir dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c728a7444e81

      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e742026c6e6e6e2b0f3f7e9b2f5c8f8a
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy BRITUME
        id: deployment
        uses: actions/deploy-pages@d3f6c1e5a4b7c8d9e0f123456789abcdef0123456
